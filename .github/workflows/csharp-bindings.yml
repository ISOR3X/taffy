on:
  push:
  pull_request:

name: C# Bindings

jobs:
  build-csharp-bindings:
    name: "Build C# Bindings (${{ matrix.rid }})"
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            native-lib: target/release/ctaffy.dll
          - os: ubuntu-latest
            rid: linux-x64
            native-lib: target/release/libctaffy.so
          - os: macos-latest
            rid: osx-arm64
            native-lib: target/release/libctaffy.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'
      - name: Build bindings
        run: bash bindings/csharp/generate-bindings.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TaffySharp-${{ matrix.rid }}
          path: |
            ${{ matrix.native-lib }}
            bindings/csharp/include/bin/Release/net4.7.2/Taffy.dll
